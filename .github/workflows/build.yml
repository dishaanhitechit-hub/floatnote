name: Build FloatNote

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Windows desktop build ────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
      - name: Build Windows
        working-directory: flutter_app
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: floatnote-windows
          path: flutter_app/build/windows/x64/runner/Release/

  # ── macOS desktop build ──────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
      - name: Build macOS
        working-directory: flutter_app
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release
      - name: Zip app
        run: cd flutter_app/build/macos/Build/Products/Release && zip -r FloatNote-macOS.zip floatnote.app
      - uses: actions/upload-artifact@v4
        with:
          name: floatnote-macos
          path: flutter_app/build/macos/Build/Products/Release/FloatNote-macOS.zip

  # ── Backend deploy to server ─────────────────────────────────────────────────
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/floatnote/backend
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            sudo systemctl restart floatnote
            echo "Backend deployed successfully"
