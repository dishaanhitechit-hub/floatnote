name: Build FloatNote

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Windows desktop build ────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
      - name: Build Windows
        working-directory: flutter_app
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: floatnote-windows
          path: flutter_app/build/windows/x64/runner/Release/

  # ── macOS desktop build ──────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
      - name: Build macOS
        working-directory: flutter_app
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release
      - name: Zip app
        run: cd flutter_app/build/macos/Build/Products/Release && zip -r FloatNote-macOS.zip floatnote.app
      - uses: actions/upload-artifact@v4
        with:
          name: floatnote-macos
          path: flutter_app/build/macos/Build/Products/Release/FloatNote-macOS.zip


