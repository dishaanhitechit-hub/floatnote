name: floatnote
description: Floating sticky note personal workspace.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # API
  http: ^1.2.1

  # State management
  provider: ^6.1.2

  # Fonts
  google_fonts: ^6.2.1

  # Notifications
  flutter_local_notifications: ^17.2.4

  # Calendar
  table_calendar: ^3.1.2

  # Color picker
  flex_color_picker: ^3.5.1

  # Confetti (stopwatch)
  confetti: ^0.7.0

  # Date formatting
  intl: ^0.19.0

  # Shared prefs (local position cache)
  shared_preferences: ^2.3.2

  # Stopwatch tick sound
  audioplayers: ^6.1.0

  # Timezone for scheduled notifications
  timezone: ^0.9.4
  flutter_timezone: ^3.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tick.mp3
